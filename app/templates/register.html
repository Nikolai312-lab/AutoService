{% extends "base.html" %}

{% block title %}Регистрация | AutoService{% endblock %}

{% block content %}

<div class="form-container">
    <h2 class="text-center mb-4">Регистрация</h2>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Потребителско име</label>
            <input type="text" name="username" class="form-control"
                   required minlength="3">
        </div>

        <div class="mb-3">
            <label class="form-label">Имейл</label>
            <input type="email" name="email" class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Парола</label>
            <input type="password" name="password" class="form-control"
                   required minlength="8">
        </div>

        <div class="mb-3">
            <label class="form-label">Повтори паролата</label>
            <input type="password" name="confirm_password"
                   class="form-control" required minlength="8">
        </div>

        <button type="submit" class="btn btn-primary w-100">
            Регистрация
        </button>

    </form>

    <p class="text-center mt-3">
        Вече имате профил?
        <a href="{{ url_for('auth.login') }}">Влезте тук</a>
    </p>
</div>

{% endblock %}
