
{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Редактиране на служител</h2>

    <div class="card mt-4">
        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Име и фамилия</label>
                    <input type="text"
                           name="name"
                           class="form-control"
                           value="{{ employee.name }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Длъжност</label>
                    <input type="text"
                           name="position"
                           class="form-control"
                           value="{{ employee.position }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Телефон</label>
                    <input type="text"
                           name="phone"
                           class="form-control"
                           value="{{ employee.phone or '' }}">
                </div>

                <button type="submit" class="btn btn-primary">
                    Запази промените
                </button>

                <a href="{{ url_for('admin.employees') }}"
                   class="btn btn-secondary">
                    Отказ
                </a>

            </form>

        </div>
    </div>

</div>

{% endblock %}
