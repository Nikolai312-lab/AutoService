{% extends "base.html" %}

{% block title %}Вход | AutoService{% endblock %}

{% block content %}

<div class="form-container">
    <h2 class="text-center mb-4">Вход в профила</h2>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Имейл</label>
            <input type="email" name="email" class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Парола</label>
            <input type="password" name="password" class="form-control"
                   required>
        </div>

        <button type="submit" class="btn btn-primary w-100">
            Вход
        </button>

    </form>

    <p class="text-center mt-3">
        Нямате профил?
        <a href="{{ url_for('auth.register') }}">Регистрирайте се</a>
    </p>
</div>

{% endblock %}
