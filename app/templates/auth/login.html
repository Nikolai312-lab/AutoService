{% extends "base.html" %}

{% block title %}Вход в профила{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-4">

                    <h2 class="text-center mb-4">Вход в профила</h2>

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Имейл</label>
                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Въведи имейл"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Парола</label>
                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Въведи парола"
                                required
                            >
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Вход
                        </button>
                    </form>

                    <p class="text-center mt-3">
                        Нямаш профил?
                        <a href="{{ url_for('auth.register') }}">
                            Регистрирай се
                        </a>
                    </p>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
```
