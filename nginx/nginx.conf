events {
    worker_connections 1024;
}

http {
    upstream autoservice_backend {
        server web1:8000;
        server web2:8000;
    }

    # HTTP
    server {
        listen 80;

        location / {
            proxy_pass http://autoservice_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;

        ssl_certificate /etc/nginx/certificates/autoservice.crt;
        ssl_certificate_key /etc/nginx/certificates/autoservice.key;

        location / {
            proxy_pass http://autoservice_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}